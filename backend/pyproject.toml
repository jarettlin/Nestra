[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nestra"
version = "0.1.0"
description = "Nestra smart home backend: appliance simulator, natural-language commands and fuzzy-logic control."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "firebase-admin>=6.5",
    "faster-whisper>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["nestra*"]

[tool.setuptools.package-data]
nestra = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
